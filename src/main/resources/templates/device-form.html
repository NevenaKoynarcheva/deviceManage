<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${deviceId == null ? 'Ново устройство' : 'Редакция на устройство'}">Устройство</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Мониторинг на мрежата</h1>
    <nav>
        <a th:href="@{/}">Начало</a>
        <a th:href="@{/devices}">Устройства</a>
        <a th:href="@{/links}">Връзки</a>
        <span class="user" th:if="${currentUser}" th:text="${currentUser + (isAdmin ? ' (администратор)' : ' (наблюдател)')}"></span>
        <form th:if="${currentUser}" th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="link-btn">Изход</button>
        </form>
    </nav>
</header>
<main>
    <h2 th:text="${deviceId == null ? 'Ново устройство' : 'Редакция на устройство'}"></h2>
    <form th:action="@{${deviceId == null ? '/devices' : '/devices/' + deviceId}}"
          th:object="${deviceForm}" method="post" class="form">

        <label>Име
            <input type="text" th:field="*{name}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label>IP адрес
            <input type="text" th:field="*{ipAddress}" placeholder="192.168.1.1">
        </label>
        <p class="error" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}"></p>

        <label>Тип
            <select th:field="*{type}">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
        </label>

        <label>SNMP версия
            <select th:field="*{snmpVersion}">
                <option th:each="v : ${versions}" th:value="${v}" th:text="${v}"></option>
            </select>
        </label>

        <label>SNMP порт
            <input type="number" th:field="*{snmpPort}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('snmpPort')}" th:errors="*{snmpPort}"></p>

        <label>Read community (по избор, без нея само ping)
            <input type="text" th:field="*{readCommunity}">
        </label>
        <p class="error" th:if="${#fields.hasErrors('readCommunity')}" th:errors="*{readCommunity}"></p>

        <label><span th:text="${deviceId == null ? 'Write community (по избор)' : 'Write community (празно = без промяна)'}"></span>
            <input type="password" th:field="*{writeCommunity}">
        </label>

        <div class="actions">
            <button type="submit" class="btn">Запази</button>
            <a th:href="@{${deviceId == null ? '/devices' : '/devices/' + deviceId}}">Отказ</a>
        </div>
    </form>
</main>
</body>
</html>
