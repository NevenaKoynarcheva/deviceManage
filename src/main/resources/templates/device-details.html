<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${device.name}">Устройство</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<header><h1>Мониторинг на мрежата</h1></header>
<main>
    <a th:href="@{/devices}">← Всички устройства</a>

    <div class="toolbar">
        <h2 th:text="${device.name}"></h2>
        <span class="badge" th:classappend="${#strings.toLowerCase(device.status)}"
              th:text="${device.status}"></span>
    </div>

    <div class="cards">
        <div class="card"><span>IP адрес</span><b th:text="${device.ipAddress}"></b></div>
        <div class="card"><span>Тип</span><b th:text="${device.type}"></b></div>
        <div class="card"><span>Последно видяно</span>
            <b th:text="${device.lastSeen != null ? #temporals.format(device.lastSeen, 'dd.MM.yyyy HH:mm:ss') : '—'}"></b></div>
        <div class="card"><span>Ping</span>
            <b th:text="${latest != null and latest.pingLatencyMs != null ? #numbers.formatDecimal(latest.pingLatencyMs, 1, 1) + ' ms' : '—'}"></b></div>
        <div class="card"><span>Загуба на пакети</span>
            <b th:text="${latest != null and latest.packetLossPercent != null ? #numbers.formatDecimal(latest.packetLossPercent, 1, 0) + ' %' : '—'}"></b></div>
        <div class="card"><span>Uptime</span>
            <b th:text="${latest != null and latest.uptimeSeconds != null
                ? (latest.uptimeSeconds / 86400) + ' д ' + ((latest.uptimeSeconds % 86400) / 3600) + ' ч ' + ((latest.uptimeSeconds % 3600) / 60) + ' мин'
                : '—'}"></b></div>
    </div>

    <div class="period">
        <button data-hours="1">1 час</button>
        <button data-hours="24">24 часа</button>
        <button data-hours="168">7 дни</button>
    </div>
    <p id="empty" hidden>Няма данни за избрания период.</p>

    <h3>Закъснение</h3>
    <div class="chart-box"><canvas id="latencyChart"></canvas></div>

    <h3>Загуба на пакети</h3>
    <div class="chart-box"><canvas id="lossChart"></canvas></div>
</main>

<script th:inline="javascript">
    const deviceId = /*[[${device.id}]]*/ 0;
    let latencyChart, lossChart;

    function fmt(t) {
        return new Date(t).toLocaleString('bg-BG',
            { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    async function load(hours) {
        const res = await fetch(`/api/devices/${deviceId}/metrics?hours=${hours}`);
        const data = await res.json();
        const labels = data.map(p => fmt(p.time));

        document.querySelectorAll('.period button')
            .forEach(b => b.classList.toggle('active', b.dataset.hours == hours));
        document.getElementById('empty').hidden = data.length > 0;

        if (latencyChart) latencyChart.destroy();
        if (lossChart) lossChart.destroy();

        latencyChart = new Chart(document.getElementById('latencyChart'), {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: 'Ping (ms)', data: data.map(p => p.pingLatencyMs),
                        borderColor: '#1f6feb', pointRadius: 0 },
                    { label: 'SNMP отговор (ms)', data: data.map(p => p.responseTimeMs),
                        borderColor: '#2da44e', pointRadius: 0 }
                ]
            },
            options: { animation: false, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, title: { display: true, text: 'ms' } } } }
        });

        lossChart = new Chart(document.getElementById('lossChart'), {
            type: 'bar',
            data: {
                labels,
                datasets: [
                    { label: 'Загуба на пакети (%)', data: data.map(p => p.packetLossPercent),
                        backgroundColor: '#cf222e' }
                ]
            },
            options: { animation: false, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    document.querySelectorAll('.period button')
        .forEach(b => b.addEventListener('click', () => load(b.dataset.hours)));
    load(1);
</script>
</body>
</html>
