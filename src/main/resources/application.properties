spring.application.name=deviceManage
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/nms?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Europe/Sofia
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

nms.polling.interval-ms=30000

# Прагове за проблеми на началния екран
nms.threshold.cpu=80
nms.threshold.memory=90
nms.threshold.latency-ms=100
nms.threshold.packet-loss=0
